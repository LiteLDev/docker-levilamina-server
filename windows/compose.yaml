services:
  levilamina-server:
    image: ghcr.io/liteldev/levilamina-server:latest-windows
    environment:
      EULA: TRUE
    ports:
      - 19132:19132/udp
      - 19132:19132/tcp
    volumes:
      - levilamina-server-data:C:\data
    stdin_open: true
    # lip run sends "stop" to the server on docker stop; give the server time to save the world.
    stop_grace_period: 2m
    tty: true

volumes:
  levilamina-server-data:
