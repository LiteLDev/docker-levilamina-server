services:
  levilamina-server:
    image: ghcr.io/liteldev/levilamina-server:latest-windows
    environment:
      EULA: TRUE
    ports:
      - 19132:19132/udp
      - 19132:19132/tcp
    volumes:
      - levilamina-server-data:C:\data
    stdin_open: true
    tty: true

volumes:
  levilamina-server-data:
