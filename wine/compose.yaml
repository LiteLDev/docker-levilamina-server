services:
  levilamina-server:
    image: ghcr.io/liteldev/levilamina-server:latest-wine
    environment:
      EULA: TRUE
    ports:
      - 19132:19132/udp
      - 19132:19132/tcp
    volumes:
      - levilamina-server-data:/data
    stop_grace_period: 1m
    stdin_open: true
    tty: true

volumes:
  levilamina-server-data:
